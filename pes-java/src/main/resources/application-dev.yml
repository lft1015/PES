spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pes_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: liao2004
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # never：不在应用启动时重置数据库。
      # 界面配置的 RBAC 权限（角色-菜单关联等）可持久保存；
      # 如需重新初始化，临时改为 always 或手动执行 db/schema.sql + db/data.sql。
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

logging:
  level:
    com.pes: DEBUG
    org.springframework.security: DEBUG